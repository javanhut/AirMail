# ImLazy configuration file

[settings]
default = "build"

[variables]
# Where `install` puts things. `$HOME/.local` needs no root and is picked up by
# the desktop automatically; override per run, e.g.
#     imlazy install prefix=/usr/local
# For a system-wide install, build as yourself and copy as root, so cargo never
# leaves root-owned files in target/:
#     imlazy release && sudo imlazy install-files prefix=/usr/local
prefix = "$HOME/.local"

[commands]

# Everything below that builds or runs AirMail depends on this first. It checks
# for what the build links against (gtk4, libadwaita, webkitgtk-6.0) and the
# tools it calls, and installs only what is missing through `sudo rvn install`
# -- so a fresh machine needs nothing fetched by hand. A no-op when all is
# there. See scripts/system-deps.sh for the list.
[commands.system-deps]
desc = "Install the system packages AirMail needs (gtk4, libadwaita, webkitgtk-6.0, …) with rvn"
alias = ["setup"]
run = ["scripts/system-deps.sh"]

[commands.build]
desc = "Build airmail"
dep = ["system-deps"]
alias = ["b"]
run = ["cargo build"]
watch = ["src/**/*.rs", "Cargo.toml"]

[commands.release]
desc = "Build airmail with optimisations"
dep = ["system-deps"]
run = ["cargo build --release"]

[commands.run]
desc = "Run the airmail GUI"
dep = ["system-deps"]
alias = ["r"]
run = ["cargo run"]
watch = ["src/**/*.rs", "Cargo.toml"]

[commands.debug]
desc = "Run the GUI with airmail's own tracing turned up"
dep = ["system-deps"]
env = { RUST_LOG = "airmail=debug,info" }
run = ["cargo run"]

[commands.inspector]
desc = "Run the GUI with the GTK Inspector attached (widget tree, CSS, live styles)"
dep = ["system-deps"]
env = { GTK_DEBUG = "interactive" }
run = ["cargo run"]

[commands.strict]
desc = "Run the GUI with GTK criticals made fatal — a UI smoke test with a window"
dep = ["system-deps"]
env = { G_DEBUG = "fatal-criticals" }
run = ["cargo run"]

[commands.check]
desc = "Type-check everything, tests included"
dep = ["system-deps"]
alias = ["c"]
run = ["cargo check --all-targets"]
watch = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml"]

[commands.clippy]
desc = "Lint with warnings as errors"
dep = ["system-deps"]
alias = ["l", "lint"]
run = ["cargo clippy --all-targets -- -D warnings"]

[commands.fmt]
desc = "Format code"
alias = ["f"]
run = ["cargo fmt"]

[commands.fmt-check]
desc = "Check formatting without rewriting anything"
run = ["cargo fmt --check"]

[commands.test]
desc = "Run tests"
dep = ["system-deps"]
alias = ["t"]
run = ["cargo test"]
watch = ["src/**/*.rs", "tests/**/*.rs"]

[commands.test-ui]
desc = "Run only the UI tests (setup form, palette) — no display needed"
dep = ["system-deps"]
run = ["cargo test --test ui_smoke"]

[commands.gate]
desc = "Everything CI would check: formatting, lints, tests"
alias = ["ci"]
dep = ["fmt-check", "clippy", "test"]
run = ["echo 'gate: formatting, lints and tests all pass'"]

[commands.doctor]
desc = "Check IMAP/SMTP connectivity for all configured accounts"
dep = ["system-deps"]
run = ["cargo run -- --doctor"]

[commands.deps]
desc = "Show the GTK/libadwaita/WebKitGTK versions this build links against"
run = [
  "pkg-config --modversion gtk4 libadwaita-1 webkitgtk-6.0",
  "cargo tree --depth 1",
]

[commands.install]
desc = "Build and install AirMail for the current user (override: prefix=/usr/local)"
dep = ["release", "install-files"]
run = ["echo 'AirMail installed to {{prefix}} — it should now show up in your launcher'"]

[commands.install-files]
desc = "Copy an already-built AirMail into prefix, without building it first"
dep = ["system-deps"]
run = [
  "install -Dm755 target/release/airmail {{prefix}}/bin/airmail",
  "install -Dm644 data/icons/hicolor/scalable/apps/dev.raven.AirMail.svg {{prefix}}/share/icons/hicolor/scalable/apps/dev.raven.AirMail.svg",
  "install -Dm644 data/dev.raven.AirMail.desktop {{prefix}}/share/applications/dev.raven.AirMail.desktop",
  # The entry ships with a bare `Exec=airmail`; point it at wherever it landed.
  # Double quotes, so a prefix like `$HOME/.local` is expanded by the shell
  # rather than written into the file — `Exec=` may not contain a literal `$`,
  # and desktop-file-validate rejects the entry if it does. The `\$` keeps the
  # regex's end-of-line anchor out of the shell's hands.
  "sed -i \"s|^Exec=airmail\\$|Exec={{prefix}}/bin/airmail|\" {{prefix}}/share/applications/dev.raven.AirMail.desktop",
  "desktop-file-validate {{prefix}}/share/applications/dev.raven.AirMail.desktop",
  "update-desktop-database {{prefix}}/share/applications || true",
  "gtk4-update-icon-cache -qtf {{prefix}}/share/icons/hicolor || true",
]

[commands.uninstall]
desc = "Remove an installed AirMail — accounts and cached mail are left alone"
run = [
  "rm -f {{prefix}}/bin/airmail",
  "rm -f {{prefix}}/share/applications/dev.raven.AirMail.desktop",
  "rm -f {{prefix}}/share/icons/hicolor/scalable/apps/dev.raven.AirMail.svg",
  "update-desktop-database {{prefix}}/share/applications || true",
  "echo 'Removed AirMail from {{prefix}}. Your accounts (~/.config/airmail) and mail (~/.local/share/airmail) are untouched.'",
]

[commands.clean]
desc = "Remove build artefacts"
run = ["cargo clean"]
